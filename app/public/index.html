<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneClick ERP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>OneClick ERP</h1>
    <nav>
      <button data-tab="dashboard" class="active">Dashboard</button>
      <button data-tab="products">Products &amp; Stock</button>
      <button data-tab="customers">Customers</button>
      <button data-tab="orders">Sales Orders</button>
    </nav>
    <span id="version" class="muted"></span>
  </header>

  <main>
    <p id="message" role="status"></p>

    <section id="dashboard" class="tab">
      <div class="cards">
        <div class="card"><span>Products</span><strong id="stat-products">-</strong></div>
        <div class="card"><span>Customers</span><strong id="stat-customers">-</strong></div>
        <div class="card"><span>Open orders</span><strong id="stat-orders">-</strong></div>
        <div class="card"><span>Revenue</span><strong id="stat-revenue">-</strong></div>
      </div>
      <h2>Low stock (at or below reorder level)</h2>
      <table><thead><tr><th>SKU</th><th>Name</th><th>In stock</th><th>Reorder at</th></tr></thead>
        <tbody id="low-stock"></tbody></table>
    </section>

    <section id="products" class="tab" hidden>
      <form id="product-form" class="inline">
        <input name="sku" placeholder="SKU" required maxlength="40">
        <input name="name" placeholder="Name" required>
        <input name="unit_price" type="number" step="0.01" min="0" placeholder="Unit price" required>
        <input name="stock_qty" type="number" min="0" placeholder="Stock qty" required>
        <input name="reorder_level" type="number" min="0" placeholder="Reorder level" required>
        <button type="submit">Add product</button>
      </form>
      <table><thead><tr><th>SKU</th><th>Name</th><th>Price</th><th>Stock</th><th>Reorder at</th><th></th></tr></thead>
        <tbody id="product-rows"></tbody></table>
    </section>

    <section id="customers" class="tab" hidden>
      <form id="customer-form" class="inline">
        <input name="name" placeholder="Name" required>
        <input name="email" type="email" placeholder="Email">
        <input name="phone" placeholder="Phone">
        <button type="submit">Add customer</button>
      </form>
      <table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th></th></tr></thead>
        <tbody id="customer-rows"></tbody></table>
    </section>

    <section id="orders" class="tab" hidden>
      <form id="order-form" class="inline">
        <select name="customer_id" id="order-customer" required></select>
        <select name="product_id" id="order-product" required></select>
        <input name="quantity" type="number" min="1" value="1" required>
        <button type="submit">Create order</button>
      </form>
      <table><thead><tr><th>#</th><th>Customer</th><th>Lines</th><th>Total</th><th>Status</th><th>Created</th><th></th></tr></thead>
        <tbody id="order-rows"></tbody></table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
