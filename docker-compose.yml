# Local development: the same two containers that run on the AWS app server.
#   docker compose up --build      ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      retries: 10

  app:
    build:
      context: ./app
      args:
        APP_VERSION: local
    environment:
      DATABASE_URL: postgres://erp:erp@db:5432/erp
    ports:
      - "9090:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
