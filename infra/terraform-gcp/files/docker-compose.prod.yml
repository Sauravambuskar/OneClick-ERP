# Runs on the GCP App VM at /opt/erp. Values come from /opt/erp/.env
# (written at boot; APP_IMAGE is updated by deploy.sh on every release).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      retries: 20
    logging:
      driver: gcplogs
      options:
        gcp-project: "${GCP_PROJECT}"
        gcp-log-name: "${LOG_NAME}-postgres"

  app:
    image: ${APP_IMAGE:-none}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://erp:${DB_PASSWORD}@db:5432/erp
      PORT: "3000"
    # Bound to loopback only: public traffic arrives through Caddy.
    # deploy.sh health-checks this port directly, bypassing the TLS redirect.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: gcplogs
      options:
        gcp-project: "${GCP_PROJECT}"
        gcp-log-name: "${LOG_NAME}-app"

  # TLS terminator. With APP_DOMAIN set it obtains and renews a Let's Encrypt
  # certificate automatically; without one it serves plain HTTP on port 80.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: gcplogs
      options:
        gcp-project: "${GCP_PROJECT}"
        gcp-log-name: "${LOG_NAME}-caddy"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
